      THESIS: Freshness urgency is the product, so the interface is built from the konbini

      OWN-WORLD: cool konbini-floor ground, pure-white product packages, ink type, canary

      STORY: the cook walks their own kitchen like a convenience store at 19:00 — every grocery
      wears an evening tag that escalates as its window closes, and cooking it tonight captures
      the full value before it is written off.
      FIRST VIEWPORT: a store sign header with live date; an EAT-FIRST shelf of packages wearing
      red and orange evening tags; one cook-tonight package carrying the big canary start sticker;
      a thermal receipt line teasing food saved.
